<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spidey Payload - Latest APK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f1a;
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(56, 130, 246, .18), transparent),
      radial-gradient(ellipse 50% 40% at 85% 85%, rgba(168, 85, 247, .15), transparent);
    color: #e7ecf5;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(22, 28, 44, .85);
    border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    backdrop-filter: blur(12px);
  }
  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 18px;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #3882f6, #a855f7);
    box-shadow: 0 8px 24px rgba(56, 130, 246, .35);
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: .3px; }
  .sub { color: #8b95ab; font-size: 14px; margin: 8px 0 26px; }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 15px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 8px 22px rgba(34, 197, 94, .3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(34, 197, 94, .4); }
  .btn:active { transform: translateY(0); }
  .meta {
    margin-top: 18px;
    font-size: 12.5px;
    color: #6b7690;
    min-height: 18px;
  }
  .stats {
    margin-top: 8px;
    font-size: 12.5px;
    color: #8b95ab;
    min-height: 18px;
  }
  .stats b { color: #e7ecf5; font-weight: 700; }
  .badge {
    display: inline-block;
    margin-bottom: 16px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #7dd3fc;
    background: rgba(56, 130, 246, .12);
    border: 1px solid rgba(56, 130, 246, .25);
  }
  footer { margin-top: 22px; font-size: 11.5px; color: #4b5568; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <div class="badge">auto build</div>
    <h1>Latest APK</h1>
    <p class="sub">Latest build from the apk-drop bot.<br>Tap download, then install on your device.</p>
    <a class="btn" href="latest.apk" download="spidey.apk">⬇️ Download APK</a>
    <div class="meta" id="meta">Loading build info...</div>
    <div class="stats" id="stats">&nbsp;</div>
    <footer>spidey payload &middot; @spideyapksupport</footer>
  </div>
<script>
  fetch('meta.json?ts=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (m) {
      var d = new Date(m.updated * 1000);
      var mb = (m.size / 1048576).toFixed(1);
      document.getElementById('meta').textContent =
        'Updated: ' + d.toLocaleString() + '  ·  ' + mb + ' MB';
    })
    .catch(function () {
      document.getElementById('meta').textContent = 'No build published yet - check back soon.';
    });

  fetch('stats?ts=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (s) {
      document.getElementById('stats').innerHTML =
        '👀 Visitors: <b>' + s.visitors + '</b> &nbsp;&middot;&nbsp; ⬇️ APK clicks: <b>' + s.downloads + '</b>';
    })
    .catch(function () {
      document.getElementById('stats').style.display = 'none';
    });
</script>
</body>
</html>
